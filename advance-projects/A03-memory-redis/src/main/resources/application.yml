spring:
  ai:
    zhipuai:
      # api-key 使用你自己申请的进行替换；如果为了安全考虑，可以通过启动参数进行设置
      api-key: ${ZHIPUAI_API_KEY:${AI_API_KEY:}}
      chat: # 聊天模型
        options:
          model: GLM-4.7-Flash
  data:
    redis: # redis 配置
      host: localhost
      port: 6379
      password:

# 对话记忆配置
app:
  chat-memory:
    redis:
      # 会话 key 过期时间，支持 Spring Duration 格式（如 24h、30m、7d）；设为 0 表示不过期
      ttl: 24h

# 修改日志级别
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug
