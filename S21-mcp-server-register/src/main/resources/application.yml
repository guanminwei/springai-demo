spring:
  ai:
    mcp:
      server:
        name: multi-register-demo
        version: 1.0.0
        type: SYNC
        instructions: "演示 MCP Server 工具注册的三种不同方式"
        sse-message-endpoint: /mcp/messages
        sse-endpoint: /sse
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: true

server:
  port: 8072

logging:
  level:
    io.modelcontextprotocol.server.transport.WebMvcSseServerTransportProvider: debug
