spring:
  ai:
    zhipuai:
      # api-key 使用你自己申请的进行替换；如果为了安全考虑，可以通过启动参数进行设置
      api-key: ${ZHIPUAI_API_KEY:${AI_API_KEY:}}
      image: # 图像模型
        options:
          model: CogView-3-Flash
      chat: # 聊天模型
        options:
          model: GLM-4.7-Flash

# 图像生成应用参数（类型安全，可按环境覆盖）
app:
  image:
    generate:
      width: 1024
      height: 1024
      model: CogView-3-Flash     # SDK bug: 必须显式指定，否则会被默认值 cogview-3 覆盖
      style: natural              # natural | vivid
      response-format: png

# 修改日志级别
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: debug